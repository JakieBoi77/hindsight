name: Unity Tests

# Runs the game's EditMode + PlayMode tests with GameCI (Development Plan §11).
# Requires repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD
# (see https://game.ci/docs/github/activation). Until they are configured the
# test job is skipped rather than failing.

on:
  pull_request:
    paths: [src/HindsightGame/**, .github/workflows/unity-ci.yml]
  push:
    branches: main
    paths: [src/HindsightGame/**, .github/workflows/unity-ci.yml]
  workflow_dispatch:

jobs:
  check-license:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: echo "available=${{ env.UNITY_LICENSE != '' }}" >> "$GITHUB_OUTPUT"

  test:
    needs: check-license
    if: needs.check-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: src/HindsightGame/Library
          key: unity-library-${{ hashFiles('src/HindsightGame/Packages/packages-lock.json', 'src/HindsightGame/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: src/HindsightGame
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
